<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부서별 일일 예정사항</title>
<script id="embedded-state" type="application/json">null</script>
<style id="page-rule">@page { size: A4 portrait; margin: 0; }</style>
<style>
/* =========================================================
   화면(UI)
   ========================================================= */
:root {
  --bg: #eceff3;
  --panel: #ffffff;
  --soft: #f6f7f9;
  --line: #dde1e7;
  --line2: #c6ccd5;
  --text: #1d232b;
  --sub: #5d6875;
  --accent: #2257c5;
  --accent-weak: #e9f0fd;
  --danger: #c2362b;
  --ok: #1e7d43;
  --warn: #a35f00;
  --ui-font: "맑은 고딕", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", "NanumGothic", "나눔고딕", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui-font);
  font-size: 13px;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: flex; flex-direction: column; height: 100vh; }

/* 모드별 표시 */
body.mode-view .editor, body.mode-view .edit-only { display: none !important; }
body:not(.mode-view) .view-only { display: none !important; }

/* 상단 바 */
.topbar {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; font-size: 15px; white-space: nowrap; margin-right: 10px; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-weight: 400; font-size: 12px; color: var(--sub); }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 4px;
  height: 32px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 6px;
  background: #fff; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--soft); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible, .linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.strong { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.btn.small { height: 28px; padding: 0 10px; font-size: 12px; }
.btn-split { display: inline-flex; }
.btn-split .btn:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.btn-split .btn.caret { border-left: none; border-top-left-radius: 0; border-bottom-left-radius: 0; padding: 0 8px; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; font-size: 12px; }
.menu-wrap { position: relative; }
.menu {
  position: absolute; top: 36px; left: 0; z-index: 50; min-width: 300px;
  background: #fff; border: 1px solid var(--line2); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px;
}
.menu[hidden] { display: none; }
.menu button {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%;
  border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 5px; cursor: pointer;
}
.menu button:hover, .menu button:focus-visible { background: var(--accent-weak); outline: none; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.menu .desc { display: block; font-size: 11px; color: var(--sub); }
kbd { font-family: inherit; font-size: 11px; color: var(--sub); border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; }
.save-state { font-size: 12px; color: var(--sub); white-space: nowrap; }
.save-state.dirty { color: var(--warn); font-weight: 700; }
.save-state.clean { color: var(--ok); }

/* 작업 영역 */
.workspace { flex: 1; display: flex; min-height: 0; }
.editor {
  width: 490px; flex: none; display: flex; flex-direction: column; min-height: 0;
  background: var(--soft); border-right: 1px solid var(--line);
}
.tabs { flex: none; display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
.tab {
  border: 1px solid transparent; border-bottom: none; background: none; padding: 7px 14px; cursor: pointer;
  border-radius: 6px 6px 0 0; color: var(--sub); margin-bottom: -1px;
}
.tab.is-active { background: var(--soft); border-color: var(--line); color: var(--text); font-weight: 700; }
.tab-pages { flex: 1; overflow-y: auto; padding: 12px; }
.tab-page[hidden] { display: none; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.panel h2 { font-size: 13px; margin: 0 0 10px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.panel-head h2 { margin: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.span2 { grid-column: 1 / -1; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span, .row-label { font-size: 12px; color: var(--sub); }
input[type=text], input[type=date], input[type=number], select {
  height: 30px; padding: 0 8px; border: 1px solid var(--line2); border-radius: 6px; background: #fff; min-width: 0;
}
input[type=number] { width: 70px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }

/* 접수 현황 */
.recv { border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-size: 12px; line-height: 1.6; }
.recv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pill { padding: 1px 8px; border-radius: 10px; font-weight: 700; }
.pill.ok, .badge.ok { background: #e3f4ea; color: var(--ok); }
.pill.self, .badge.self { background: #e9edf2; color: var(--sub); }
.pill.none, .badge.none { background: #fff0dc; color: var(--warn); }
.recv .muted { color: var(--sub); }
.recv-miss { margin-top: 4px; color: var(--warn); }
.recv-miss.ok { color: var(--ok); }
.recv-hint { margin-top: 4px; color: var(--sub); }

/* 부서 카드 */
.dept-card { border: 1px solid var(--line); border-radius: 8px; background: #fff; margin-bottom: 8px; overflow: hidden; }
.dept-card.flash { animation: flash 1s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.dept-card.is-hidden { opacity: .55; }
.dept-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--soft); border-bottom: 1px solid var(--line); }
.dept-no { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-weak); color: var(--accent); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.dept-name { flex: 1; font-weight: 700; height: 28px !important; }
.badge { flex: none; font-size: 11px; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
.dept-show { flex: none; display: flex; align-items: center; gap: 3px; font-size: 12px; color: var(--sub); cursor: pointer; user-select: none; }
.icon-btn { flex: none; width: 26px; height: 26px; border: 1px solid var(--line2); background: #fff; border-radius: 5px; cursor: pointer; font-size: 10px; color: var(--sub); padding: 0; }
.icon-btn:hover { background: var(--soft); color: var(--text); }
.icon-btn.danger:hover { color: #fff; background: var(--danger); border-color: var(--danger); }
.dept-text {
  display: block; width: 100%; min-height: 70px; max-height: 420px; resize: vertical;
  border: 0; padding: 8px 10px; line-height: 1.6; tab-size: 2; background: #fff;
}
.dept-text:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.add-dept { width: 100%; height: 34px; border: 1px dashed var(--line2); border-radius: 8px; background: transparent; color: var(--sub); cursor: pointer; }
.add-dept:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-weak); }

.steps { margin: 0; padding-left: 18px; line-height: 1.8; }

/* 서식 */
.set-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px dashed var(--line); }
.set-row:first-of-type { border-top: 0; padding-top: 0; }
.set-row > .row-label { width: 92px; flex: none; }
.set-row .grow { flex: 1; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; background: #fff; flex-wrap: wrap; }
.seg label { position: relative; }
.seg label + label { border-left: 1px solid var(--line2); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 5px 10px; cursor: pointer; font-size: 12px; }
.seg input:checked + span { background: var(--accent); color: #fff; font-weight: 700; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.hint { font-size: 12px; color: var(--sub); margin: 6px 0 0; line-height: 1.55; }
.range-row { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 10px; padding: 4px 0; }
.range-row output { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.mode-auto[hidden], .mode-manual[hidden] { display: none; }

/* 도움말 */
.help table { width: 100%; border-collapse: collapse; font-size: 12px; }
.help th, .help td { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left; vertical-align: top; }
.help th { color: var(--sub); font-weight: 500; }
.help code, .hint code, .modal code { font-family: Consolas, "D2Coding", monospace; background: #f0f2f5; padding: 1px 4px; border-radius: 3px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
.help pre { background: #f0f2f5; border-radius: 6px; padding: 8px 10px; font-family: Consolas, "D2Coding", monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; margin: 6px 0; }
.help h3 { font-size: 13px; margin: 14px 0 6px; }
.help h3:first-child { margin-top: 0; }
.help ul, .help ol { margin: 4px 0; padding-left: 18px; line-height: 1.7; }

/* 미리보기 */
.preview-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.preview-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 44px; }
.status { flex: 1; min-width: 0; font-size: 12px; line-height: 1.4; }
.status.ok { color: var(--ok); }
.status.bad { color: var(--danger); font-weight: 700; }
.status .muted { color: var(--sub); font-weight: 400; }
.status .legend-tip { text-decoration: underline dotted #2f6fe0; text-decoration-thickness: 1.5px; text-underline-offset: .22em; }
.status .legend-link { color: #1847b8; text-decoration: underline; }
.preview-scroll { flex: 1; overflow: auto; padding: 24px; }
.sheet-holder { position: relative; margin: 0 auto; }

/* 설명 팝업 */
.tip-pop {
  position: fixed; z-index: 85; max-width: 400px; min-width: 180px;
  background: #fff; color: var(--text); border: 1px solid var(--line2); border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 10px 12px; font: 13px/1.6 var(--ui-font);
  word-break: keep-all; overflow-wrap: break-word;
}
.tip-pop[hidden] { display: none; }
.tip-pop .tip-title { font-size: 11px; font-weight: 700; color: var(--sub); margin-bottom: 4px; }
.tip-pop a { color: var(--accent); word-break: break-all; }
.tip-pop .tip-links { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
.tip-pop .tip-links:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.tip-pop mark { background: #ffe680; }
.tip-pop .imp { color: #c40000; font-weight: 700; }

/* 토스트 / 모달 / 드롭 */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 100;
  background: #222b36; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px;
  box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 80vw; line-height: 1.5; display: flex; align-items: center; gap: 14px;
}
.toast[hidden] { display: none; }
.toast button { border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; border-radius: 5px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
.toast button:hover { background: rgba(255,255,255,.12); }
.modal { position: fixed; inset: 0; z-index: 90; background: rgba(20,26,34,.45); display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-box { width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.modal-box.wide { width: min(1040px, 100%); }
.modal-box h3 { margin: 0 0 6px; font-size: 15px; }
.modal-box p { margin: 0 0 10px; color: var(--sub); line-height: 1.6; }
.modal-box textarea { width: 100%; height: 320px; border: 1px solid var(--line2); border-radius: 6px; padding: 10px; line-height: 1.6; resize: vertical; tab-size: 8; }
.modal-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 12px; }
.modal-actions .grow { flex: 1; color: var(--sub); }
.imp-wrap { max-height: 56vh; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.imp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.imp-table th { position: sticky; top: 0; z-index: 1; background: var(--soft); text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); font-weight: 700; color: var(--sub); }
.imp-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.imp-table tr.off td { opacity: .5; }
.imp-table tr.off td:first-child { opacity: 1; }
.imp-table select { max-width: 190px; }
.imp-table .fn { font-weight: 700; word-break: break-all; }
.imp-table .meta { color: var(--sub); }
.imp-table .note { color: var(--warn); font-weight: 700; }
.imp-table .pv { white-space: pre-wrap; color: #333; max-height: 6.4em; overflow: hidden; line-height: 1.6; }
.imp-date { margin: 0 0 10px; padding: 8px 10px; background: #fff7e8; border: 1px solid #f1d7a6; border-radius: 6px; }
.imp-date[hidden] { display: none; }
.drop {
  position: fixed; inset: 0; z-index: 95; background: rgba(34,87,197,.12); border: 3px dashed var(--accent);
  display: grid; place-items: center; font-size: 20px; font-weight: 700; color: var(--accent); pointer-events: none;
}
.drop[hidden] { display: none; }

@media (max-width: 1100px) { .editor { width: 410px; } .brand small { display: none; } }

/* =========================================================
   A4 문서
   ========================================================= */
.sheet {
  position: absolute; top: 0; left: 0; transform-origin: 0 0;
  width: 210mm; height: 297mm;
  background: #fff; color: #000;
  box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 8px 28px rgba(0,0,0,.12);
  font-family: var(--doc-font, "맑은 고딕", "Malgun Gothic", sans-serif);
  word-break: keep-all; overflow-wrap: break-word;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
  --fs: 11pt; --lh: 1.5; --ls: 0em; --gap: .2em; --padv: .3em; --padh: .6em;
  --title-fs: 20pt; --meta-fs: 10pt; --deptw: 6em; --margin: 12mm;
}
.sheet.landscape { width: 297mm; height: 210mm; }
.sheet.over { outline: 3px solid #e53935; outline-offset: 0; }
.sheet.over::after {
  content: "▲ 여기까지가 A4 한 장 (아래는 인쇄되지 않음)"; position: absolute; left: 0; right: 0; top: 100%;
  border-top: 2px dashed #e53935; color: #e53935; font: 700 12px var(--ui-font); padding: 4px 8px; background: rgba(255,235,235,.9);
}
.sheet-inner { position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding: var(--margin); display: flex; flex-direction: column; }
.doc-head { flex: none; margin-bottom: 3mm; }
.head-row { display: flex; align-items: center; gap: 4mm; }
.head-main { flex: 1; min-width: 0; text-align: center; }
.doc-title { font-size: var(--title-fs); font-weight: 800; letter-spacing: .04em; line-height: 1.3; }
.doc-meta { display: flex; justify-content: space-between; align-items: flex-end; gap: 4mm; margin-top: 2mm; font-size: var(--meta-fs); line-height: 1.3; }
.doc-meta .doc-date { margin-left: auto; font-weight: 700; white-space: nowrap; }
.approval { flex: none; border-collapse: collapse; font-size: 9pt; line-height: 1.2; }
.approval th, .approval td { border: 1px solid #000; text-align: center; padding: 0; }
.approval th { height: 6mm; width: 17mm; font-weight: 500; background: #f2f2f2; }
.approval td { height: 14mm; }
.approval .ap-h { width: 6mm; }
.sheet.l-block .doc-head, .sheet.l-block2 .doc-head { border-bottom: 2px solid #000; padding-bottom: 2mm; }
.doc-body { flex: 1 1 auto; min-height: 0; position: relative; }
.doc-foot { flex: none; margin-top: 2.5mm; font-size: var(--meta-fs); line-height: 1.4; }
.doc-foot[hidden], .doc-title[hidden] { display: none; }

.flow { font-size: var(--fs); line-height: var(--lh); letter-spacing: var(--ls); }
.flow.measure-half { width: calc((100% - 5mm) / 2); }
.flow.two { display: flex; gap: 5mm; align-items: flex-start; }
.flow.two > .col { flex: 1 1 0; min-width: 0; }
.flow .empty-all { color: #888; text-align: center; padding: 20mm 0; font-size: 12pt; }

/* 표형 */
.sched { width: 100%; border-collapse: collapse; table-layout: fixed; border-top: 2px solid #000; border-bottom: 2px solid #000; }
.sched col.c-dept { width: var(--deptw); }
.sched th, .sched td { border: 1px solid #8a8a8a; padding: var(--padv) var(--padh); }
.sched tr > :first-child { border-left: 0; }
.sched tr > :last-child { border-right: 0; }
.sched thead th { background: #e7e9ec; font-weight: 700; text-align: center; border-bottom: 1.5px solid #000; letter-spacing: .1em; }
.sched td.dept { text-align: center; vertical-align: middle; font-weight: 700; background: #f4f5f6; letter-spacing: -.02em; line-height: 1.3; }
.sched td.cont { vertical-align: top; }

/* 예정사항 칸을 좌우 2칸으로 (일정을 알아서 나눠 담음) */
.sched td.half-a { border-right-color: #c4c4c4; }
/* 표를 두 칸에 걸쳐 넓게: 한 부서 안에서 좌우 2칸 줄과 넓은 표 줄이 번갈아 나옴 */
.sched tbody.unit tr.more > :first-child { border-left: 1px solid #8a8a8a; }
.sched tbody.unit tr:not(:last-child) > td.cont { border-bottom-color: #c4c4c4; }
.dblk > .seg-wide { padding-left: .2em; margin-top: calc(var(--gap) + .2em); }
.dblk > .halves + .halves { margin-top: calc(var(--gap) + .2em); }
.halves { display: flex; }
.halves > .half-a, .halves > .half-b { flex: 1 1 0; min-width: 0; }
.halves > .half-b { border-left: 1px solid #c4c4c4; padding-left: .7em; margin-left: .7em; }
.md .grp > * { margin: 0; }
.md .grp > * + * { margin-top: var(--gap); }
.md .grp > .h:not(:first-child) { margin-top: calc(var(--gap) * 2 + .25em); }

/* 제목형 */
.dblk + .dblk { margin-top: calc(.55em + var(--gap) * 2); }
.dname { display: flex; align-items: center; gap: .35em; font-weight: 800; font-size: 1.06em; border-bottom: 1.5px solid #222; padding-bottom: .1em; margin-bottom: calc(.15em + var(--gap)); line-height: 1.35; }
.dname::before { content: ""; flex: none; width: .42em; height: .42em; background: #222; }
.dblk > .md, .dblk > .halves { padding-left: .2em; }

/* 마크다운 본문 */
.md > * { margin: 0; }
.md > * + * { margin-top: var(--gap); }
.md .sp { height: calc(.12em + var(--gap) * .6); }
.md .h { font-weight: 800; }
.md .h1 { font-size: 1.1em; }
.md .h2 { font-size: 1.05em; }
.md > .h:not(:first-child) { margin-top: calc(var(--gap) * 2 + .25em); }
.md .li { display: flex; }
.md .li .mk { flex: none; min-width: .9em; margin-right: .3em; }
.md .li .tx { flex: 1 1 auto; min-width: 0; }
.md .li.small > .mk, .md .li.small > .tx { font-size: max(calc(1em - 2pt), .75em, 6pt); }
/* 하위 줄(들여 쓴 -, * 작은 글씨)은 윗줄에 붙임 — 간격은 서식 탭 '하위 줄 붙이기' */
.md .li.sub { line-height: var(--sub-lh-dash, var(--lh)); }
.md .li.small { line-height: var(--sub-lh-star, var(--lh)); }
.md .li.sub:not(:first-child) { margin-top: var(--sub-mt-dash, var(--gap)); }
.md .li.small:not(:first-child) { margin-top: var(--sub-mt-star, var(--gap)); }
.md .li.sub + .li.sub:not(:first-child), .md .li.small + .li.small:not(:first-child),
.md .li.sub + .li.small:not(:first-child), .md .li.small + .li.sub:not(:first-child) { margin-top: var(--sub-mt-next, var(--gap)); }
.md .tm { font-weight: 700; font-variant-numeric: tabular-nums; }
.md b, .md strong { font-weight: 700; }
.md mark { background: #ffeb5a; color: inherit; padding: 0 .08em; }
/* 표 칸 폭 조절 손잡이 (화면에서만) */
.rz-layer { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 5; }
.rz { position: absolute; pointer-events: auto; touch-action: none; cursor: col-resize; }
.rz::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; background: #2257c5; opacity: 0; transition: opacity .12s; border-radius: 2px; }
.doc-body:hover .rz::after { opacity: .25; }
.rz:hover::after, .rz.active::after, .rz:focus::after { opacity: 1; }
.rz:focus { outline: none; }
.rz:focus::after { background: #e8590c; }
body.resizing, body.resizing * { user-select: none; cursor: col-resize !important; }
.rz-wide { position: absolute; pointer-events: auto; font: 600 11px/1 var(--ui-font); color: #2257c5; background: #fff; border: 1px solid #9db8f0; border-radius: 10px; padding: 3px 8px; cursor: pointer; white-space: nowrap; opacity: .35; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.doc-body:hover .rz-wide { opacity: .85; }
.rz-wide:hover, .rz-wide:focus-visible { opacity: 1; background: #e6eeff; outline: none; }
.rz-tip { position: fixed; z-index: 120; pointer-events: none; background: #222b36; color: #fff; font: 12px/1.4 var(--ui-font); padding: 4px 9px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.25); white-space: pre; }
.rz-tip[hidden] { display: none; }
/* 형광펜 */
.hl-btn .hl-sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; background: #ffeb5a; border: 1px solid #d9b400; }
.hl-btn.on { background: #fff6bf; border-color: #d9b400; font-weight: 700; }
body.hl-mode .sheet .unit, body.hl-mode .sheet .unit * { cursor: text; }
body.hl-mode .sheet ::selection { background: rgba(255, 214, 0, .6); }
.md .imp { color: #c40000; font-weight: 700; }
.md code { font-family: Consolas, "D2Coding", monospace; font-size: .92em; }
.md .q { border-left: 2px solid #999; padding-left: .5em; color: #333; }
.md hr { border: 0; border-top: 1px dashed #999; height: 0; }
.md .mdt { width: 100%; border-collapse: collapse; }
.md .mdt.fixed { table-layout: fixed; }
.md .mdt th, .md .mdt td { border: 1px solid #a0a0a0; padding: .08em .35em; vertical-align: top; }
.md .mdt th { background: #f0f1f3; font-weight: 700; text-align: center; }
.md .empty { color: #777; }
.md a { color: inherit; text-decoration: none; }

/* 링크·설명은 화면에서만 표시 (줄 높이·폭은 그대로라 인쇄와 배치가 같음) */
@media screen {
  .md a { color: #1847b8; text-decoration: underline; text-underline-offset: .15em; }
  .md a:hover { background: #e6eeff; }
  .has-tip { cursor: help; }
  .md .li.has-tip > .tx, .md .p.has-tip, .md .q.has-tip, .md .h.has-tip, .sched td.dept.has-tip, .dname.has-tip {
    text-decoration: underline dotted #2f6fe0; text-decoration-thickness: 1.5px; text-underline-offset: .22em;
  }
  .has-tip:focus { outline: 2px solid #9db8f0; outline-offset: 1px; }
}

/* =========================================================
   인쇄
   ========================================================= */
@media print {
  html, body { height: auto; overflow: visible; background: #fff; }
  .app { display: block; height: auto; }
  .topbar, .editor, .preview-bar, .toast, .modal, .drop, .tip-pop, .rz-layer, .rz-tip { display: none !important; }
  .workspace, .preview-pane, .preview-scroll { display: block; overflow: visible; padding: 0; margin: 0; height: auto; }
  .sheet-holder { width: auto !important; height: auto !important; margin: 0; }
  .sheet { position: relative; transform: none !important; box-shadow: none; overflow: hidden; outline: none; }
  .sheet.over::after { display: none; }
  .doc-body { overflow: hidden; }
}
</style>
<style id="lock-style">
/* 비밀번호 잠금 화면 (맞는 비밀번호를 넣기 전에는 화면 코드가 실행되지 않음) */
body.locked > *:not(.lock) { display: none !important; }
.lock {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 200;
  display: grid; place-items: center; padding: 16px; background: #eceff3;
  font-family: "맑은 고딕", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
.lock[hidden] { display: none; }
.lock.pw-dialog { background: rgba(20,26,34,.45); }
.lock-box {
  width: min(340px, 100%); background: #fff; border: 1px solid #dde1e7; border-radius: 10px;
  padding: 22px 22px 18px; box-shadow: 0 12px 40px rgba(0,0,0,.18);
  display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #1d232b;
}
.lock-title { font-size: 16px; font-weight: 700; }
.lock-desc { margin: 0; color: #5d6875; line-height: 1.55; }
.lock-box label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5d6875; }
.lock-box input { height: 34px; border: 1px solid #c6ccd5; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 14px; color: #1d232b; }
.lock-box input:focus { outline: 2px solid #2257c5; outline-offset: -1px; border-color: #2257c5; }
.lock-msg { min-height: 18px; color: #c2362b; font-size: 12px; font-weight: 700; }
.lock-btn { height: 34px; padding: 0 14px; border: 1px solid #2257c5; background: #2257c5; color: #fff; border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
.lock-btn.sub { background: #fff; color: #1d232b; border-color: #c6ccd5; font-weight: 400; }
.lock-actions { display: flex; justify-content: flex-end; gap: 8px; }
.lock-box.shake { animation: lockShake .35s; }
@keyframes lockShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media print { body.locked { display: none; } .lock { display: none !important; } }
</style>
</head>

  function keyOf(pw, env) {
    if (cur && cur.pw === pw && cur.salt === env.salt && cur.iter === env.iter) return Promise.resolve(cur.key);
    var id = env.salt + '|' + env.iter + '|' + pw;
    return cache[id] || (cache[id] = derive(pw, env.salt, env.iter));
  }
  function decWith(key, env) { return subtle.decrypt({ name: 'AES-GCM', iv: env.iv }, key, env.ct).then(function (pt) { return td.decode(pt); }); }
  function decryptPw(t, pw) { var env = parse(t); return keyOf(pw, env).then(function (key) { return decWith(key, env); }); }

  /* 다른 비밀번호로 잠긴 것(예전 작업 파일 등)을 열 때 그 비밀번호를 묻는다. 건너뛰면 null */
  var askQ = Promise.resolve();
  function ask(t, what) {
    var run = function () {
      return new Promise(function (resolve) {
        var box = el('pwAsk'), inp = el('pwAskPw'), msg = el('pwAskMsg');
        el('pwAskDesc').textContent = what + '은(는) 다른 비밀번호로 잠겨 있습니다. 그 비밀번호를 넣어 주세요.';
        inp.value = ''; msg.textContent = ''; box.hidden = false;
        setTimeout(function () { inp.focus(); }, 0);
        function done(v) { box.hidden = true; el('pwAskForm').onsubmit = null; box.onclick = null; resolve(v); }
        el('pwAskForm').onsubmit = function (e) {
          e.preventDefault();
          if (!inp.value) return;
          msg.textContent = '여는 중…';
          decryptPw(t, inp.value).then(done, function () { msg.textContent = '비밀번호가 맞지 않습니다.'; inp.select(); });
        };
        box.onclick = function (e) { if (e.target.hasAttribute('data-ask-skip')) done(null); };
      });
    };
    var p = askQ.then(run);
    askQ = p.catch(function () { /* 다음 질문 */ });
    return p;
  }

  var rekeyFns = [];
  window.__docLock = {
    isEnc: isEnc,
    /* 지금 비밀번호로 잠근 글 (Promise) */
    encrypt: function (text) { return encWith(cur, String(text)); },
    /* 잠긴 글이면 풀고(지금 비밀번호 → 안 되면 물어봄), 아니면 그대로. 건너뛰면 null (Promise) */
    open: function (t, what) {
      t = String(t || '');
      if (!isEnc(t)) return Promise.resolve(t);
      return decryptPw(t, cur.pw).catch(function () { return ask(t, what || '이 내용'); });
    },
    onRekey: function (fn) { rekeyFns.push(fn); }
  };

  /* 열기 */
  var payload = null;      // 풀린 화면·코드 (비밀번호를 바꿀 때 다시 잠그려고)
  var started = false;
  function run(markup, code) {
    if (started) return;
    started = true;
    document.body.classList.remove('locked');
    el('lockScreen').hidden = true;
    if (markup != null) el('app-code').insertAdjacentHTML('beforebegin', markup);
    var s = document.createElement('script');
    s.text = code;
    document.body.appendChild(s);      // 여기서 화면 코드가 실행됨
    document.body.removeChild(s);
  }
  function busy(on) { var b = el('lockForm').querySelector('button[type="submit"]'); b.disabled = on; b.textContent = on ? '여는 중…' : '열기'; }
  function fail(text) {
    el('lockMsg').textContent = text;
    var box = el('lockForm');
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    el('lockPw').select();
  }
  el('lockTitle').textContent = document.title;
  el('lockForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = el('lockPw'), pw = inp.value;
    if (!pw || started) return;
    if (!subtle) { fail('이 브라우저에서는 열 수 없습니다. Edge나 Chrome으로 여세요.'); return; }
    busy(true);
    el('lockMsg').textContent = '';
    var raw = el('app-code').textContent.trim();
    if (!isEnc(raw)) {                 // 개발용 원본 (암호화 안 됨)
      newKey(pw).then(function (k) { cur = k; inp.value = ''; run(null, raw); }, function () { busy(false); fail('열지 못했습니다.'); });
      return;
    }
    var env = parse(raw);
    keyOf(pw, env).then(function (key) {
      return decWith(key, env).then(function (txt) {
        var p = JSON.parse(txt);
        cur = { key: key, salt: env.salt, iter: env.iter, pw: pw };
        payload = txt; inp.value = '';
        run(p.m, p.c);
      });
    }).catch(function () { cache = {}; busy(false); fail('비밀번호가 맞지 않습니다.'); });
  });
  setTimeout(function () { try { el('lockPw').focus(); } catch (err) { /* 무시 */ } }, 0);

  /* 비밀번호 바꾸기: 새 비밀번호로 다시 잠근 이 파일을 내려받음 */
  function fileName() {
    var n = '';
    try { n = decodeURIComponent(location.pathname.split('/').pop() || ''); } catch (err) { n = ''; }
    return /\.html?$/i.test(n) ? n : (document.title || '문서') + '.html';
  }
  var CODE_OPEN = '<' + 'script type="text/plain" id="app-code">', ST_OPEN = '<' + 'script id="embedded-state" type="application/json">', CLOSE = '<' + '/script>';
  function between(html, open) {
    var s = html.indexOf(open), e = s < 0 ? -1 : html.indexOf(CLOSE, s + open.length);
    return s < 0 || e < 0 ? null : { s: s + open.length, e: e, text: html.slice(s + open.length, e) };
  }
  function replaceIn(html, open, text) { var r = between(html, open); return r ? html.slice(0, r.s) + text + html.slice(r.e) : html; }
  function devPayload(html) {          // 개발용 원본: 앱 화면 표시 사이의 HTML + 코드
    var a = html.indexOf(MARK_A), b = html.indexOf(MARK_B), c = between(html, CODE_OPEN);
    if (a < 0 || b < a || !c) throw new Error('앱 화면 표시를 찾지 못했습니다.');
    var m = html.slice(html.indexOf('-->', a) + 3, b);
    return { json: JSON.stringify({ m: m, c: c.text }), cut: [a, b + MARK_B.length] };
  }
  function openChange() {
    ['pwOld', 'pwNew', 'pwNew2'].forEach(function (id) { el(id).value = ''; });
    el('pwMsg').textContent = '';
    el('pwDialog').hidden = false;
    el('pwOld').focus();
  }
  el('pwForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var o = el('pwOld').value, nw = el('pwNew').value, msg = el('pwMsg');
    if (!cur || o !== cur.pw) { msg.textContent = '지금 비밀번호가 맞지 않습니다.'; el('pwOld').select(); return; }
    if (nw.length < 8 || !/[A-Za-z]/.test(nw) || !/[0-9]/.test(nw)) { msg.textContent = '새 비밀번호는 8자 이상, 영문과 숫자를 함께 넣어 주세요.'; el('pwNew').focus(); return; }
    if (nw === o) { msg.textContent = '지금 비밀번호와 다르게 정해 주세요.'; el('pwNew').focus(); return; }
    if (nw !== el('pwNew2').value) { msg.textContent = '새 비밀번호 두 칸이 서로 다릅니다.'; el('pwNew2').select(); return; }
    msg.textContent = '다시 잠그는 중…';
    var html = window.__PRISTINE_HTML, k2, plain, dev = null;
    try { if (payload == null) dev = devPayload(html); } catch (err) { msg.textContent = err.message; return; }
    plain = payload != null ? payload : dev.json;
    newKey(nw).then(function (k) {
      k2 = k;
      if (dev) html = html.slice(0, dev.cut[0]) + '<!-- 앱 화면: 암호화되어 app-code 안에 있습니다 -->' + html.slice(dev.cut[1]);
      return encWith(k2, plain);
    }).then(function (codeEnv) {
      html = replaceIn(html, CODE_OPEN, '\n' + codeEnv + '\n');
      var st = between(html, ST_OPEN), t = st ? st.text.trim() : '';
      if (!t || t === 'null') return null;
      return (isEnc(t) ? decryptPw(t, cur.pw) : Promise.resolve(t)).then(function (p) { return encWith(k2, p); });
    }).then(function (stEnv) {
      if (stEnv) html = replaceIn(html, ST_OPEN, stEnv);
      cur = k2; payload = plain; cache = {};
      window.__PRISTINE_HTML = html;
      rekeyFns.forEach(function (fn) { try { fn(); } catch (err) { /* 무시 */ } });
      var name = fileName(), url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' })), a = document.createElement('a');
      a.href = url; a.download = name; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      el('pwDialog').hidden = true;
      alert('비밀번호를 바꿨습니다. 새 비밀번호로 다시 잠근 파일(' + name + ')을 내려받았습니다.\n\n' +
        '· 지금 쓰는 파일을 이 파일로 바꾸고, 옛 파일은 지우세요. 옛 파일은 옛 비밀번호로 계속 열립니다.\n' +
        '· 이 창에서 저장하는 것(자동저장·작업 파일·보기 파일)은 지금부터 새 비밀번호로 잠깁니다.\n' +
        '· 비밀번호를 잊으면 풀 방법이 없으니 잘 보관하세요.');
    }).catch(function (err) { msg.textContent = '바꾸지 못했습니다: ' + (err && err.message ? err.message : err); });
  });
  el('pwDialog').addEventListener('click', function (e) {
    if (e.target === this || e.target.hasAttribute('data-pw-close')) this.hidden = true;
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') el('pwDialog').hidden = true; });
  window.__lock = { change: openChange };
})();
</script>
</body>
</html>
