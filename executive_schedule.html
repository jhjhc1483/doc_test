<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임원 일일 예정사항</title>
<style id="page-rule">@page { size: A4 portrait; margin: 0; }</style>
<style>
/* =========================================================
   화면(UI)
   ========================================================= */
:root {
  --bg: #eceff3;
  --panel: #ffffff;
  --soft: #f6f7f9;
  --line: #dde1e7;
  --line2: #c6ccd5;
  --text: #1d232b;
  --sub: #5d6875;
  --accent: #2257c5;
  --accent-weak: #e9f0fd;
  --danger: #c2362b;
  --ok: #1e7d43;
  --warn: #a35f00;
  --ui-font: "맑은 고딕", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", "NanumGothic", "나눔고딕", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui-font);
  font-size: 13px;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: flex; flex-direction: column; height: 100vh; }

/* 상단 바 */
.topbar {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; font-size: 15px; white-space: nowrap; margin-right: 10px; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-weight: 400; font-size: 12px; color: var(--sub); }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 4px;
  height: 32px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 6px;
  background: #fff; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--soft); }
.btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible, .slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.strong { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.btn-split { display: inline-flex; }
.btn-split .btn:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.btn-split .btn.caret { border-left: none; border-top-left-radius: 0; border-bottom-left-radius: 0; padding: 0 8px; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; font-size: 12px; }
.menu-wrap { position: relative; }
.menu {
  position: absolute; top: 36px; left: 0; z-index: 50; min-width: 300px;
  background: #fff; border: 1px solid var(--line2); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px;
}
.menu[hidden] { display: none; }
.menu button {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%;
  border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 5px; cursor: pointer;
}
.menu button:hover, .menu button:focus-visible { background: var(--accent-weak); outline: none; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.menu .desc { display: block; font-size: 11px; color: var(--sub); }
kbd { font-family: inherit; font-size: 11px; color: var(--sub); border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; }
.save-state { font-size: 12px; color: var(--sub); white-space: nowrap; }
.save-state.dirty { color: var(--warn); font-weight: 700; }
.save-state.clean { color: var(--ok); }

/* 작업 영역 */
.workspace { flex: 1; display: flex; min-height: 0; }
.editor {
  width: 470px; flex: none; display: flex; flex-direction: column; min-height: 0;
  background: var(--soft); border-right: 1px solid var(--line);
}
.tabs { flex: none; display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
.tab {
  border: 1px solid transparent; border-bottom: none; background: none; padding: 7px 14px; cursor: pointer;
  border-radius: 6px 6px 0 0; color: var(--sub); margin-bottom: -1px;
}
.tab.is-active { background: var(--soft); border-color: var(--line); color: var(--text); font-weight: 700; }
.tab-pages { flex: 1; overflow-y: auto; padding: 12px; }
.tab-page[hidden] { display: none; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.panel h2 { font-size: 13px; margin: 0 0 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.span2 { grid-column: 1 / -1; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: 12px; color: var(--sub); }
input[type=text], input[type=date], input[type=number], select {
  height: 30px; padding: 0 8px; border: 1px solid var(--line2); border-radius: 6px; background: #fff; min-width: 0;
}
input[type=number] { width: 70px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.hint { font-size: 12px; color: var(--sub); margin: 6px 0 0; line-height: 1.55; }
.hint code, .help code { font-family: Consolas, "D2Coding", monospace; background: #f0f2f5; padding: 1px 4px; border-radius: 3px; font-size: 12px; white-space: pre-wrap; }

/* 배치(자리) — 화면의 배치도·작은 아이콘·A4 문서가 같은 칸 나눔을 씁니다 */
.lay {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-template-areas:
    "a a a a b b b b c c c c"
    "d d d d d d d d e e e e"
    "d d d d d d d d f f f f"
    "g g g g g g h h h h h h";
}
.map { grid-template-rows: repeat(4, 1fr); gap: 4px; height: 168px; }
.slot {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-width: 0; min-height: 0; overflow: hidden; padding: 2px 4px;
  border: 1px solid var(--line2); border-radius: 6px; background: #fff; cursor: pointer; line-height: 1.3; text-align: center;
}
.slot:hover { background: var(--accent-weak); border-color: var(--accent); }
.slot .s-pos { font-weight: 700; font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .s-meta { font-size: 11px; color: var(--sub); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .s-meta.none { color: var(--warn); }
.slot.is-focus { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.slot.drag-from { opacity: .45; }
.slot.drag-over { background: var(--accent-weak); border-color: var(--accent); border-style: dashed; }
.mini { display: inline-grid; width: 30px; height: 21px; gap: 1px; grid-template-rows: repeat(4, 1fr); flex: none; }
.mini i { background: #d5dae1; border-radius: 1px; }
.mini i.on { background: var(--accent); }

/* 임원별 입력칸 */
.ex-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; margin-bottom: 10px; scroll-margin-top: 8px; }
.ex-card.is-focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ex-card.flash { animation: flash 1s ease-out; }
@keyframes flash { from { background: var(--accent-weak); } to { background: var(--panel); } }
.ex-top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.ex-top .f-pos { flex: 1 1 0; min-width: 0; font-weight: 700; }
.ex-top .f-name { flex: 1 1 0; min-width: 0; }
.ex-slot { font-size: 11px; color: var(--sub); white-space: nowrap; }
.icon-btn { width: 26px; height: 26px; border: 1px solid var(--line2); border-radius: 5px; background: #fff; cursor: pointer; font-size: 10px; line-height: 1; padding: 0; color: var(--sub); flex: none; }
.icon-btn:hover:not(:disabled) { background: var(--soft); color: var(--text); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.ex-card textarea {
  display: block; width: 100%; border: 1px solid var(--line2); border-radius: 6px; padding: 7px 9px;
  line-height: 1.6; resize: vertical; background: #fff; min-height: 34px; tab-size: 8;
}
.ex-card .f-sched { min-height: 96px; }
.ref-row { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; }
.ref-mk { flex: none; width: 22px; height: 34px; display: grid; place-items: center; font-weight: 700; color: var(--sub); }
.ref-row textarea { flex: 1; }
.ex-sum { font-size: 11px; color: var(--sub); margin-top: 5px; }
.ex-sum.warn { color: var(--warn); }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
/* 형광펜 */
.hl-btn .hl-sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; background: #ffeb5a; border: 1px solid #d9b400; }
.hl-btn.on { background: #fff6bf; border-color: #d9b400; font-weight: 700; }
body.hl-mode .sheet .ex, body.hl-mode .sheet .xt { cursor: text; }
body.hl-mode .sheet .ex:hover, body.hl-mode .sheet .xt:hover { box-shadow: none; }
body.hl-mode .sheet ::selection { background: rgba(255, 214, 0, .6); }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.xt-slot { width: 100%; margin-top: 4px; min-height: 34px; flex-direction: row; gap: 6px; }
.xt-slot .s-meta { white-space: normal; }
#xtPanel { scroll-margin-top: 8px; }
#xtPanel.flash { animation: flash 1s ease-out; }
.xt-ed + .xt-ed { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.xt-ed-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.xt-ed-top .xt-label { flex: 1; min-width: 0; font-weight: 700; }
.xt-n { font-size: 11px; color: var(--sub); white-space: nowrap; }
.xt-cell { display: flex; gap: 6px; align-items: flex-start; margin-top: 5px; }
.xt-cell .xt-head { width: 104px; flex: none; }
.xt-cell textarea { flex: 1; min-width: 0; border: 1px solid var(--line2); border-radius: 6px; padding: 5px 8px; line-height: 1.55; resize: vertical; min-height: 30px; background: #fff; }
.xt-off { font-size: 12px; color: var(--warn); margin: 0 0 8px; }
.size-box .szh { font-size: 12px; font-weight: 700; color: var(--sub); margin: 10px 0 4px; }
.size-box .szh:first-child { margin-top: 2px; }
.size-box .szr { display: flex; align-items: center; gap: 6px 8px; margin: 3px 0; flex-wrap: wrap; }
.size-box .szt { width: 84px; flex: none; font-size: 12px; }
.size-box .szv { display: flex; gap: 4px; flex-wrap: wrap; }
.size-box .szc { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; }
.size-box .szc input { width: 62px; height: 26px; padding: 0 4px; text-align: right; }
.size-box .szc small { font-size: 10px; color: var(--sub); max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.size-box .szauto { font-size: 12px; }
.rz-tip { position: fixed; z-index: 120; pointer-events: none; background: #222b36; color: #fff; font: 12px/1.4 var(--ui-font); padding: 4px 9px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.25); white-space: pre; }
.rz-tip[hidden] { display: none; }
.size-sum { font-size: 12px; line-height: 1.7; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.size-sum b { font-weight: 700; }
.size-sum .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: #e3f4ea; color: var(--ok); margin-left: 4px; }
.size-sum .tag.man { background: var(--accent-weak); color: var(--accent); }

/* 도움말 */
.help table { width: 100%; border-collapse: collapse; font-size: 12px; }
.help th, .help td { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left; vertical-align: top; }
.help th { color: var(--sub); font-weight: 500; }
.help pre { background: #f0f2f5; border-radius: 6px; padding: 8px 10px; font-family: Consolas, "D2Coding", monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; margin: 6px 0; }
.help h3 { font-size: 13px; margin: 14px 0 6px; }
.help h3:first-child { margin-top: 0; }
.help ul { margin: 4px 0; padding-left: 18px; line-height: 1.7; }

/* 미리보기 */
.preview-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.preview-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 44px; }
.status { flex: 1; min-width: 0; font-size: 12px; line-height: 1.4; }
.status.ok { color: var(--ok); }
.status.bad { color: var(--danger); font-weight: 700; }
.status .muted { color: var(--sub); font-weight: 400; }
.preview-scroll { flex: 1; overflow: auto; padding: 24px; }
.sheet-holder { position: relative; margin: 0 auto; }

/* 가져오기 확인 창 */
.modal { position: fixed; inset: 0; z-index: 90; background: rgba(20,26,34,.45); display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-box { width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.modal-box.wide { width: min(1040px, 100%); }
.modal-box h3 { margin: 0 0 6px; font-size: 15px; }
.modal-box p { margin: 0 0 10px; color: var(--sub); line-height: 1.6; }
.modal-box textarea { width: 100%; height: 320px; border: 1px solid var(--line2); border-radius: 6px; padding: 10px; line-height: 1.6; resize: vertical; tab-size: 8; }
.modal-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 12px; }
.modal-actions .grow { flex: 1; color: var(--sub); }
.imp-wrap { max-height: 56vh; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.imp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.imp-table th { position: sticky; top: 0; z-index: 1; background: var(--soft); text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); font-weight: 700; color: var(--sub); }
.imp-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.imp-table tr.off td { opacity: .5; }
.imp-table tr.off td:first-child { opacity: 1; }
.imp-table select { max-width: 190px; }
.imp-table .fn { font-weight: 700; word-break: break-all; }
.imp-table .meta { color: var(--sub); }
.imp-table .note { color: var(--warn); font-weight: 700; }
.imp-table .pv { white-space: pre-wrap; color: #333; max-height: 6.4em; overflow: hidden; line-height: 1.6; }
.imp-date { margin: 0 0 10px; padding: 8px 10px; background: #fff7e8; border: 1px solid #f1d7a6; border-radius: 6px; }
.imp-date[hidden] { display: none; }
.imp-table .warn-dup { color: var(--danger); font-weight: 700; }
.imp-date select { margin: 0 6px; }

/* 토스트 */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 100;
  background: #222b36; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px;
  box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 80vw; line-height: 1.5; display: flex; align-items: center; gap: 14px;
}
.toast[hidden] { display: none; }
.toast button { border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; border-radius: 5px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
.toast button:hover { background: rgba(255,255,255,.12); }
.drop {
  position: fixed; inset: 0; z-index: 95; background: rgba(34,87,197,.12); border: 3px dashed var(--accent);
  display: grid; place-items: center; font-size: 20px; font-weight: 700; color: var(--accent); pointer-events: none;
}
.drop[hidden] { display: none; }

@media (max-width: 1100px) { .editor { width: 400px; } .brand small { display: none; } }

/* =========================================================
   A4 문서
   ========================================================= */
.sheet {
  position: absolute; top: 0; left: 0; transform-origin: 0 0;
  width: 210mm; height: 297mm;
  background: #fff; color: #000;
  box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 8px 28px rgba(0,0,0,.12);
  font-family: var(--doc-font, "맑은 고딕", "Malgun Gothic", sans-serif);
  word-break: keep-all; overflow-wrap: break-word;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
  --fs: 10pt; --lh: 1.45; --rp: .2em; --padv: .3em; --padh: .55em;
  --title-fs: 20pt; --meta-fs: 10pt; --margin: 10mm; --ggap: 2.4mm;
  --sub-lh-star: 1.24; --sub-mt-star: -.1em; --sub-lh-dash: 1.36; --sub-mt-dash: -.1em; --sub-mt-next: 0em; --sub-mt-xt: -.08em; --xtd: .86;
}
.sheet.landscape { width: 297mm; height: 210mm; }
.sheet.over { outline: 3px solid #e53935; outline-offset: 0; }
.sheet.over::after {
  content: "▲ 여기까지가 A4 한 장 (아래는 인쇄되지 않음)"; position: absolute; left: 0; right: 0; top: 100%;
  border-top: 2px dashed #e53935; color: #e53935; font: 700 12px var(--ui-font); padding: 4px 8px; background: rgba(255,235,235,.9);
}
.sheet-inner { position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding: var(--margin); display: flex; flex-direction: column; }
.doc-head { flex: none; margin-bottom: 3mm; border-bottom: 2px solid #000; padding-bottom: 1.6mm; position: relative; }
.secret {
  position: absolute; top: 0; right: 0; border: 1.5px solid #d40000; color: #d40000; background: #fff;
  font-weight: 800; font-size: 9.5pt; line-height: 1.25; padding: .5mm 2.2mm; letter-spacing: .15em; white-space: nowrap;
}
.secret[hidden] { display: none; }
.doc-title { font-size: var(--title-fs); font-weight: 800; letter-spacing: .06em; line-height: 1.3; text-align: center; }
.doc-title[hidden] { display: none; }
.doc-meta { display: flex; justify-content: space-between; align-items: flex-end; gap: 4mm; margin-top: 1.2mm; font-size: var(--meta-fs); line-height: 1.3; }
.doc-meta .doc-date { margin-left: auto; font-weight: 700; white-space: nowrap; }
.doc-body { flex: 1 1 auto; min-height: 0; position: relative; }
.doc-foot { flex: none; margin-top: 2.2mm; font-size: var(--meta-fs); line-height: 1.4; }
.doc-foot[hidden] { display: none; }

/* 8칸 배치: 줄 3개 — 윗줄 3칸 / 가운데 줄 큰 칸 + 오른쪽 위·아래 / 아랫줄 2칸.
   글자크기를 잴 때(.measure)는 내용 높이만큼, 맞춘 뒤에는 줄·칸 높이를 정해 페이지 끝까지 채움 */
.grid { display: flex; flex-direction: column; gap: var(--ggap); height: 100%; font-size: var(--fs); line-height: var(--lh); }
.grid.measure, .grid.free { height: auto; }
.band { flex: none; display: grid; column-gap: var(--ggap); min-height: 0; }
.stack { display: flex; flex-direction: column; gap: var(--ggap); min-width: 0; min-height: 0; }
.stack > .ex { flex: none; }
.measure .band > .ex, .measure .band > .stack { align-self: start; }

/* 칸 크기 조정 손잡이 (화면에서만) */
.rz-layer { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 5; }
.rz { position: absolute; pointer-events: auto; touch-action: none; }
.rz-v { cursor: col-resize; }
.rz-h { cursor: row-resize; }
.rz::after { content: ""; position: absolute; background: #2257c5; opacity: 0; transition: opacity .12s; border-radius: 2px; }
.rz-v::after { top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; }
.rz-h::after { left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; }
.doc-body:hover .rz::after { opacity: .25; }
.rz:hover::after, .rz.active::after, .rz:focus::after { opacity: 1; }
.rz:focus { outline: none; }
.rz:focus::after { background: #e8590c; }
body.resizing, body.resizing * { user-select: none; }
body.rz-col, body.rz-col * { cursor: col-resize !important; }
body.rz-row, body.rz-row * { cursor: row-resize !important; }
body.resizing .ex:hover { box-shadow: none; }

/* 임원 칸 */
.ex { display: flex; flex-direction: column; min-width: 0; min-height: 0; border: 1px solid #222; }
.ex-head {
  flex: none; text-align: center; background: #e7e9ec; border-bottom: 1.5px solid #222;
  padding: calc(var(--padv) * .7) var(--padh); line-height: 1.3; font-size: 1.06em;
}
.ex-head .ps { font-weight: 800; letter-spacing: .02em; }
.ex-head .nm { font-weight: 700; }
.ex-head .ps + .nm { margin-left: .45em; }
.ex-body { flex: 1 1 auto; padding: calc(var(--padv) * .5) var(--padh); }
.tl { width: 100%; border-collapse: collapse; }
.tl td { vertical-align: top; padding: var(--rp) 0; }
.tl tr + tr > td { border-top: 1px dotted #a9a9a9; }
.tl td.tm { width: 1%; padding-right: .55em; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tl td.tm .t { white-space: nowrap; }
.tl td.ct { min-width: 0; }
.ct .sb { display: flex; }
.ct .sb > .mk { flex: none; margin-right: .3em; }
.ct .sb > .tx { flex: 1 1 auto; min-width: 0; }
.ct .sb.star { font-size: max(calc(1em - 2pt), .75em, 6pt); line-height: var(--sub-lh-star); margin-top: var(--sub-mt-next); }
.ct .sb.dash { line-height: var(--sub-lh-dash); margin-top: var(--sub-mt-next); }
.ct .mn + .sb.star { margin-top: var(--sub-mt-star); }     /* 윗줄(일정 내용) 바로 아래 하위 줄은 위로 붙임 */
.ct .mn + .sb.dash { margin-top: var(--sub-mt-dash); }
.ct .pl { white-space: nowrap; }
.ex-body .none { color: #8a8a8a; text-align: center; padding: .5em 0; }
.ex-ref {
  flex: none; margin: 0 var(--padh); border-top: 1px dashed #666;
  padding: calc(var(--padv) * .8) 0 calc(var(--padv) * .9); font-size: .93em; line-height: 1.38;
}
.ex-ref .rf { display: flex; }
.ex-ref .rf + .rf { margin-top: .08em; }
.ex-ref .rm { flex: none; margin-right: .25em; }
.ex-ref .rt { flex: 1 1 auto; min-width: 0; }

/* 맨 밑 표 4개 (인접회사활동 · 휴가 · 출장/방문 · 근무): 왼쪽 이름 칸 폭을 같게 맞춰 쌓음 */
.xts { flex: none; display: flex; flex-direction: column; gap: var(--ggap); font-size: .95em; line-height: 1.38; }
.xt { width: 100%; border-collapse: collapse; table-layout: fixed; }
.xt col.xc-lb { width: calc((1 - var(--xtd)) * 100%); }
.xt th, .xt td { border: 1px solid #222; padding: calc(var(--padv) * .55) calc(var(--padh) * .8); vertical-align: top; text-align: left; font-weight: 400; }
.xt th.lb { background: #e7e9ec; font-weight: 800; text-align: center; vertical-align: middle; white-space: nowrap; padding-left: .25em; padding-right: .25em; }
.xt th.hd { background: #f3f4f6; font-weight: 700; text-align: center; }
.xt .xl + .xl { margin-top: .05em; }
.xt .xl.star { display: flex; font-size: max(calc(1em - 1.5pt), .75em, 6pt); line-height: 1.25; }
.xt .xl:not(.star) + .xl.star { margin-top: var(--sub-mt-xt); }
.xt .xl.star .mk { flex: none; margin-right: .3em; }
.xt .xtm { font-variant-numeric: tabular-nums; }
.sheet b { font-weight: 700; }
.sheet .imp { color: #c40000; font-weight: 700; }
.sheet mark { background: #ffeb5a; color: inherit; padding: 0 .08em; }
.sheet u { text-underline-offset: .15em; }

/* 화면에서만: 칸에 마우스를 올리면 표시, 누르면 그 임원 입력칸으로 */
@media screen {
  .ex { cursor: pointer; }
  .ex:hover { box-shadow: 0 0 0 2px #9db8f0; }
  .ex.is-focus { box-shadow: 0 0 0 2px var(--accent); }
  .xt { cursor: pointer; }
  .xt:hover { box-shadow: 0 0 0 2px #9db8f0; }
  .xt.is-focus { box-shadow: 0 0 0 2px var(--accent); }
}

/* =========================================================
   인쇄
   ========================================================= */
@media print {
  html, body { height: auto; overflow: visible; background: #fff; }
  .app { display: block; height: auto; }
  .topbar, .editor, .preview-bar, .toast, .drop, .modal, .rz-layer, .rz-tip { display: none !important; }
  .workspace, .preview-pane, .preview-scroll { display: block; overflow: visible; padding: 0; margin: 0; height: auto; }
  .sheet-holder { width: auto !important; height: auto !important; margin: 0; }
  .sheet { position: relative; transform: none !important; box-shadow: none; overflow: hidden; outline: none; }
  .sheet.over::after { display: none; }
  .doc-body { overflow: hidden; }
}
</style>
<style id="lock-style">
/* 비밀번호 잠금 화면 (맞는 비밀번호를 넣기 전에는 화면 코드가 실행되지 않음) */
body.locked > *:not(.lock) { display: none !important; }
.lock {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 200;
  display: grid; place-items: center; padding: 16px; background: #eceff3;
  font-family: "맑은 고딕", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
.lock[hidden] { display: none; }
.lock.pw-dialog { background: rgba(20,26,34,.45); }
.lock-box {
  width: min(340px, 100%); background: #fff; border: 1px solid #dde1e7; border-radius: 10px;
  padding: 22px 22px 18px; box-shadow: 0 12px 40px rgba(0,0,0,.18);
  display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #1d232b;
}
.lock-title { font-size: 16px; font-weight: 700; }
.lock-desc { margin: 0; color: #5d6875; line-height: 1.55; }
.lock-box label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5d6875; }
.lock-box input { height: 34px; border: 1px solid #c6ccd5; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 14px; color: #1d232b; }
.lock-box input:focus { outline: 2px solid #2257c5; outline-offset: -1px; border-color: #2257c5; }
.lock-msg { min-height: 18px; color: #c2362b; font-size: 12px; font-weight: 700; }
.lock-btn { height: 34px; padding: 0 14px; border: 1px solid #2257c5; background: #2257c5; color: #fff; border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
.lock-btn.sub { background: #fff; color: #1d232b; border-color: #c6ccd5; font-weight: 400; }
.lock-actions { display: flex; justify-content: flex-end; gap: 8px; }
.lock-box.shake { animation: lockShake .35s; }
@keyframes lockShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media print { body.locked { display: none; } .lock { display: none !important; } }
</style>
</head>

<script>
/* 비밀번호 잠금 + 암호화
   - 배포 파일에서는 화면(HTML)과 화면 코드가 app-code 안에 암호문(AES-256-GCM)으로 들어 있습니다.
     비밀번호로 키를 만들어(PBKDF2-SHA256 60만 번) 풀리면 화면을 넣고 코드를 실행합니다. 틀리면 풀리지 않습니다.

   - app-code가 암호문이 아니면(src/ 개발용 원본) 그대로 실행하고, 저장하는 것만 넣은 비밀번호로 잠급니다. */
(function () {

  var subtle = window.crypto && window.crypto.subtle;

  var askQ = Promise.resolve();
  function ask(t, what) {

      return new Promise(function (resolve) {
        var box = el('pwAsk'), inp = el('pwAskPw'), msg = el('pwAskMsg');
        el('pwAskDesc').textContent = what + '은(는) 다른 비밀번호로 잠겨 있습니다. 그 비밀번호를 넣어 주세요.';

  var started = false;
  function run(markup, code) {

  /* 비밀번호 바꾸기: 새 비밀번호로 다시 잠근 이 파일을 내려받음 */
  function fileName() {

    var o = el('pwOld').value, nw = el('pwNew').value, msg = el('pwMsg');
    if (!cur || o !== cur.pw) { msg.textContent = '지금 비밀번호가 맞지 않습니다.'; el('pwOld').select(); return; }
    if (nw.length < 8 || !/[A-Za-z]/.test(nw) || !/[0-9]/.test(nw)) { msg.textContent = '새 비밀번호는 8자 이상, 영문과 숫자를 함께 넣어 주세요.'; el('pwNew').focus(); return; }
    if (nw === o) { msg.textContent = '지금 비밀번호와 다르게 정해 주세요.'; el('pwNew').focus(); return; }
    if (nw !== el('pwNew2').value) { msg.textContent = '새 비밀번호 두 칸이 서로 다릅니다.'; el('pwNew2').select(); return; }
    msg.textContent = '다시 잠그는 중…';
    var html = window.__PRISTINE_HTML, k2, plain, dev = null;
    try { if (payload == null) dev = devPayload(html); } catch (err) { msg.textContent = err.message; return; }
    plain = payload != null ? payload : dev.json;
    newKey(nw).then(function (k) {
      k2 = k;
      if (dev) html = html.slice(0, dev.cut[0]) + '<!-- 앱 화면: 암호화되어 app-code 안에 있습니다 -->' + html.slice(dev.cut[1]);
      return encWith(k2, plain);
    }).then(function (codeEnv) {
      html = replaceIn(html, CODE_OPEN, '\n' + codeEnv + '\n');
      var st = between(html, ST_OPEN), t = st ? st.text.trim() : '';
      if (!t || t === 'null') return null;
      return (isEnc(t) ? decryptPw(t, cur.pw) : Promise.resolve(t)).then(function (p) { return encWith(k2, p); });
    }).then(function (stEnv) {
      if (stEnv) html = replaceIn(html, ST_OPEN, stEnv);
      cur = k2; payload = plain; cache = {};
      window.__PRISTINE_HTML = html;
      rekeyFns.forEach(function (fn) { try { fn(); } catch (err) { /* 무시 */ } });
      var name = fileName(), url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' })), a = document.createElement('a');
      a.href = url; a.download = name; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      el('pwDialog').hidden = true;
      alert('비밀번호를 바꿨습니다. 새 비밀번호로 다시 잠근 파일(' + name + ')을 내려받았습니다.\n\n' +
        '· 지금 쓰는 파일을 이 파일로 바꾸고, 옛 파일은 지우세요. 옛 파일은 옛 비밀번호로 계속 열립니다.\n' +
        '· 이 창에서 저장하는 것(자동저장·작업 파일·보기 파일)은 지금부터 새 비밀번호로 잠깁니다.\n' +
        '· 비밀번호를 잊으면 풀 방법이 없으니 잘 보관하세요.');
    }).catch(function (err) { msg.textContent = '바꾸지 못했습니다: ' + (err && err.message ? err.message : err); });
  });
  el('pwDialog').addEventListener('click', function (e) {
    if (e.target === this || e.target.hasAttribute('data-pw-close')) this.hidden = true;
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') el('pwDialog').hidden = true; });
  window.__lock = { change: openChange };
})();
</script>
